<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0e16" id="theme-color-meta" />
<title>Weekly Options Calendars</title>
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var theme = saved || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --radius: 0; --radius-lg: 0;
    --bg: #0b0e16; --surface: #141a28; --surface-2: #1d2538; --surface-3: #28324a;
    --text: #e7ecf5; --muted: #9aa6bd; --border: #28324a; --border-strong: #3a465f;
    --accent: #6366f1; --accent-2: #8b5cf6;
    --accent-grad: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    --on-accent: #fff;
    --glass: rgba(20,26,40,0.72); --glass-strong: rgba(20,26,40,0.9);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.28);
    --shadow-accent: 0 8px 20px rgba(99,102,241,0.35);
    --error: #f87171;
  }
  :root[data-theme='light'] {
    --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f1f3f9; --surface-3: #e5e9f2;
    --text: #1a2233; --muted: #5b6678; --border: #e5e9f2; --border-strong: #cdd5e4;
    --glass: rgba(255,255,255,0.72); --glass-strong: rgba(255,255,255,0.9);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']) {
      --bg: #f5f7fb; --surface: #ffffff; --surface-2: #f1f3f9; --surface-3: #e5e9f2;
      --text: #1a2233; --muted: #5b6678; --border: #e5e9f2; --border-strong: #cdd5e4;
      --glass: rgba(255,255,255,0.72); --glass-strong: rgba(255,255,255,0.9);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.18s ease, color 0.18s ease;
  }

  header.topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--glass); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar .title { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.01em; font-size: 1.05rem; }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: var(--radius); transition: all 0.15s ease;
  }
  .icon-btn:hover { border-color: var(--border-strong); }
  .icon-btn:active { transform: translateY(1px) scale(0.97); }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .link-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; border-radius: var(--radius); transition: all 0.15s ease;
    text-decoration: none; font-size: 0.85rem; font-weight: 600;
  }
  .link-btn:hover { border-color: var(--border-strong); }

  main { max-width: 800px; margin: 0 auto; padding: 24px; }

  .error-box {
    background: var(--surface); border: 1px solid var(--error); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 18px 22px; margin-bottom: 18px; display: none;
    gap: 12px; align-items: flex-start;
  }
  .error-box .icon { color: var(--error); flex-shrink: 0; margin-top: 2px; }

  .empty-state {
    color: var(--muted); font-size: 0.9rem; padding: 32px; text-align: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  }

  .week-list { display: flex; flex-direction: column; gap: 12px; }

  .week-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 16px 18px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .week-card.latest { border-color: var(--accent); }
  .week-card .week-info { display: flex; flex-direction: column; gap: 3px; }
  .week-card .week-range { font-weight: 700; font-size: 0.98rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .week-card .published-note { color: var(--muted); font-size: 0.78rem; }
  .latest-badge {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700;
    padding: 2px 8px; border-radius: var(--radius); border: 1px solid var(--accent); color: var(--accent);
  }
  .open-btn {
    background: var(--accent-grad); color: var(--on-accent); border: none; border-radius: var(--radius);
    padding: 9px 16px; font-size: 0.82rem; font-weight: 700; cursor: pointer; text-decoration: none;
    display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow-accent); flex-shrink: 0;
  }
  .open-btn:hover { filter: brightness(1.08); }

  footer#page-footer {
    max-width: 800px; margin: 8px auto 32px; padding: 0 24px; color: var(--muted); font-size: 0.78rem;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="title">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="0"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    Weekly Options Calendars
  </div>
  <div class="topbar-actions">
    <a class="link-btn" href="/vader-telegram-live.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
      Live dashboard
    </a>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button>
  </div>
</header>

<main>
  <div class="error-box" id="error-box">
    <span class="icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
    </span>
    <div><strong>Could not load the list of calendars.</strong></div>
  </div>

  <div id="week-list-container"></div>
</main>

<footer id="page-footer"></footer>

<script>
  // Served same-origin by the Flask app (server.py injects the real API key
  // below, replacing the placeholder in the committed source). See
  // vader-telegram-live.html / server.py for the full LAN-trust note.
  var API_KEY = '__WEBOPTIONS_API_KEY__';

  var ICONS = {
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>'
  };

  function formatRange(startIso, endIso) {
    var s = startIso.split('-').map(Number);
    var e = endIso.split('-').map(Number);
    var start = new Date(s[0], s[1] - 1, s[2]);
    var end = new Date(e[0], e[1] - 1, e[2]);
    var startLabel = start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    var endLabel = end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    return 'Week of ' + startLabel + ' - ' + endLabel;
  }

  function formatPublished(iso) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderWeeks(calendars) {
    var container = document.getElementById('week-list-container');
    if (!calendars.length) {
      container.innerHTML = '<div class="empty-state">No weekly calendars found yet.</div>';
      return;
    }
    var html = '<div class="week-list">';
    calendars.forEach(function (cal, i) {
      var isLatest = i === 0;
      // Only show the "Published <date>" subtitle when the publish date
      // isn't that week's own Monday (e.g. a weekend publish), so two
      // different weeks are never visually ambiguous.
      var showPublished = cal.publishDate !== cal.weekStart;
      html += '<div class="week-card' + (isLatest ? ' latest' : '') + '">'
        + '<div class="week-info">'
        + '<div class="week-range">' + formatRange(cal.weekStart, cal.weekEnd)
        + (isLatest ? '<span class="latest-badge">Latest</span>' : '') + '</div>'
        + (showPublished ? '<div class="published-note">Published ' + formatPublished(cal.publishDate) + '</div>' : '')
        + '</div>'
        + '<a class="open-btn" href="/calendars/' + cal.publishDate + '">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>'
        + 'Open calendar</a>'
        + '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  }

  fetch('/api/calendars', { headers: { 'X-API-Key': API_KEY } })
    .then(function (res) {
      if (!res.ok) throw new Error('Server responded with ' + res.status);
      return res.json();
    })
    .then(function (data) {
      renderWeeks(data.calendars || []);
      var now = new Date();
      var datePart = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      var timePart = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
      document.getElementById('page-footer').textContent = 'Page loaded ' + datePart + ', ' + timePart;
    })
    .catch(function () {
      document.getElementById('error-box').style.display = 'flex';
    });

  // Theme toggle
  var toggle = document.getElementById('theme-toggle');
  var metaColor = document.getElementById('theme-color-meta');
  function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'dark'; }
  function applyToggleIcon() {
    var t = currentTheme();
    toggle.innerHTML = t === 'dark' ? ICONS.sun : ICONS.moon;
    metaColor.setAttribute('content', t === 'dark' ? '#0b0e16' : '#f5f7fb');
  }
  toggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    applyToggleIcon();
  });
  applyToggleIcon();
</script>
</body>
</html>
