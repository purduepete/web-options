<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Web Options">
    <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#111827" />
            <stop offset="100%" stop-color="#1f2937" />
        </linearGradient>
    </defs>
    <rect width="32" height="32" fill="url(#tile)" />
    <!-- Two candlesticks, stepping up. Kept far apart and chunky to survive 16px. -->
    <g fill="#60a5fa">
        <rect x="8.5" y="10" width="2" height="17" />
        <rect x="5.5" y="15" width="8" height="10" />
    </g>
    <g fill="#f4a261">
        <rect x="21.5" y="5" width="2" height="17" />
        <rect x="18.5" y="7" width="8" height="10" />
    </g>
</svg>
